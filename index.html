<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dither Studio — Retro image dithering in your browser</title>
<meta name="description" content="Turn any image into 1-bit, Game Boy, CGA or sepia pixel art. Floyd–Steinberg, Atkinson, Bayer, halftone and more, with a live before/after view. Runs entirely in your browser — nothing is uploaded.">
<meta name="theme-color" content="#0d1013">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Dither Studio">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Dither Studio — Retro image dithering in your browser">
<meta property="og:description" content="Turn any image into 1-bit, Game Boy, CGA or sepia pixel art. Floyd–Steinberg, Atkinson, Bayer, halftone and more, with a live before/after view. Runs entirely in your browser — nothing is uploaded.">
<meta property="og:url" content="https://zed2101.github.io/dither-studio/">
<meta property="og:image" content="https://zed2101.github.io/dither-studio/assets/og.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="Dither Studio: an image shown half in colour, half dithered to black and white.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dither Studio — Retro image dithering in your browser">
<meta name="twitter:description" content="Turn any image into 1-bit, Game Boy, CGA or sepia pixel art. 7 algorithms, 10 palettes, batch export. No upload, no install.">
<meta name="twitter:image" content="https://zed2101.github.io/dither-studio/assets/og.png">

<link rel="canonical" href="https://zed2101.github.io/dither-studio/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="root" class="root">
  <input id="file" type="file" accept="image/*" multiple hidden>

  <header class="topbar">
    <span class="logo" aria-hidden="true"></span>
    <h1 class="wordmark">Dither Studio</h1>
    <span id="status" class="status mono"></span>
    <span class="spacer"></span>
    <a class="btn btn-icon" href="https://github.com/Zed2101/dither-studio" target="_blank" rel="noopener" title="View on GitHub" aria-label="View on GitHub">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
    <button id="theme" class="btn" type="button">Dark</button>
  </header>

  <main class="workspace">

    <section id="stage" class="stage" aria-label="Preview">
      <div id="viewer" class="viewer" hidden>
        <div class="layer"><canvas id="orig"></canvas></div>
        <div class="layer" id="clip"><canvas id="dith"></canvas></div>
        <div id="divider" class="divider">
          <span class="divider-line"></span>
          <span id="handle" class="handle" role="separator" aria-label="Drag to compare"><span>◀</span><span>▶</span></span>
        </div>
        <span class="tag tag-before mono">original</span>
        <span id="algoTag" class="tag tag-after mono"></span>
        <div class="zoombar">
          <button id="zoomOut" class="zbtn" type="button" aria-label="Zoom out">−</button>
          <button id="zoomReset" class="zbtn zbtn-wide mono" type="button" title="Reset view">100%</button>
          <button id="zoomIn" class="zbtn" type="button" aria-label="Zoom in">+</button>
        </div>
      </div>

      <div id="dropzone" class="dropzone">
        <div class="drop-card" id="dropCard">
          <span class="drop-icon" aria-hidden="true"></span>
          <p class="drop-title">Drop one or more images here</p>
          <p class="drop-sub">or click to browse, or paste with Ctrl+V</p>
          <button id="demo" class="btn" type="button">Try a demo image</button>
        </div>
      </div>

      <div id="overlay" class="drag-overlay" hidden>Drop to add</div>
    </section>

    <aside class="panel" aria-label="Controls">

      <section class="group">
        <div class="group-head">
          <h2 class="group-title">Images</h2>
          <button id="add" class="btn btn-sm" type="button">+ Add</button>
        </div>
        <div id="thumbs" class="thumbs" hidden></div>
        <p id="noImages" class="muted">No image loaded.</p>
      </section>

      <section class="group">
        <h2 class="group-title">Algorithm</h2>
        <div id="algos" class="algos" role="radiogroup" aria-label="Algorithm"></div>
      </section>

      <section class="group">
        <h2 class="group-title">Parameters</h2>
        <label class="field">
          <span class="field-head"><span>Pixel size</span><span id="pixelVal" class="mono muted"></span></span>
          <input id="pixel" type="range" min="1" max="12" step="1" value="2">
        </label>
        <label class="field">
          <span class="field-head"><span>Brightness / threshold</span><span id="biasVal" class="mono muted"></span></span>
          <input id="bias" type="range" min="-120" max="120" step="1" value="0">
        </label>
        <label class="field" id="strengthField">
          <span class="field-head"><span>Strength</span><span id="strengthVal" class="mono muted"></span></span>
          <input id="strength" type="range" min="0" max="100" step="1" value="100">
        </label>
        <label class="field" id="cellField" hidden>
          <span class="field-head"><span>Dot grid</span><span id="cellVal" class="mono muted"></span></span>
          <input id="cell" type="range" min="3" max="24" step="1" value="8">
        </label>
      </section>

      <section class="group">
        <h2 class="group-title">Palette</h2>
        <div id="palettes" class="palettes" role="radiogroup" aria-label="Palette"></div>
        <div id="customRow" class="custom-row" hidden></div>
      </section>

      <section class="group">
        <h2 class="group-title">Export</h2>
        <p id="exportInfo" class="mono muted"></p>
        <button id="png" class="btn btn-primary" type="button" disabled>Download PNG</button>
        <div class="row">
          <button id="copy" class="btn" type="button" disabled>Copy</button>
          <button id="zip" class="btn" type="button" disabled>ZIP</button>
        </div>
      </section>

    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="app.js"></script>
</body>
</html>
